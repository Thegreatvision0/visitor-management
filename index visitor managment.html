<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DJJS Noormahal — Sewadar & Accommodation Management (Prototype)</title>
<style>
/* =====================================================================
   DJJS Noormahal — Frontend prototype styles
   ===================================================================== */
:root{--bg:#f6f4f0;--card:#fff;--ink:#1f2328;--muted:#6b7280;--line:#e6e1d8;--pri:#b45309;--pri-d:#92400e;--pri-l:#fef3e2;--side:#2a1b12;--side2:#3b281b;
--ok:#15803d;--okl:#dcfce7;--warn:#a16207;--warnl:#fef3c7;--bad:#b91c1c;--badl:#fee2e2;--info:#1d4ed8;--infol:#dbeafe;--pur:#6d28d9;--purl:#ede9fe;--gray:#4b5563;--grayl:#eceae6;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:0}h3{font-size:15px;margin:0 0 10px}
.muted{color:var(--muted)}small{color:var(--muted)}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
.ribbon{background:#7c2d12;color:#fff;font-size:12px;padding:5px 12px;text-align:center}
.shell{display:flex;min-height:calc(100vh - 27px)}
#side{width:244px;background:var(--side);color:#e9dfd6;flex:none;display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 27px);overflow:auto}
.brand{padding:16px 16px 12px;border-bottom:1px solid var(--side2)}
.brand b{display:block;font-size:16px;color:#fff}.brand span{font-size:12px;color:#c9b8a8}
#side nav{padding:8px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;background:none;color:#e9dfd6;border-radius:8px;text-align:left}
.nav:hover{background:var(--side2)}.nav.on{background:var(--pri);color:#fff}
.nav svg,.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav .cnt{margin-left:auto;background:#f59e0b;color:#1f1300;border-radius:99px;font-size:11px;padding:0 7px;font-weight:600}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px}
.gsw{position:relative;flex:1;max-width:460px}
.gsw .ic{position:absolute;left:10px;top:9px;color:var(--muted)}
.gsw input{width:100%;padding:8px 10px 8px 34px;border:1px solid var(--line);border-radius:8px;background:#faf9f7}
.dd{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px #0002;min-width:300px;max-height:380px;overflow:auto;z-index:50}
.gsw .dd{left:0;right:auto;width:100%}
.dd .it{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.dd .it:hover{background:var(--pri-l)}.dd .it:last-child{border-bottom:0}
.tr{margin-left:auto;display:flex;align-items:center;gap:10px;position:relative}
.iconbtn{position:relative;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px}
.iconbtn .n{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:0 5px}
.prof{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.prof small{display:block;line-height:1.1}
main{padding:20px;max-width:1500px;width:100%}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.stat.click:hover{border-color:var(--pri);box-shadow:0 2px 10px #b4530922}
.stat .v{font-size:28px;font-weight:700;line-height:1.1}.stat .l{color:var(--muted);font-size:12.5px;margin-top:4px}.stat .s{font-size:12px;margin-top:6px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;color:var(--ink)}
.btn:hover{background:#faf6f0}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri-d)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:3px 9px;font-size:12.5px}.btn[disabled]{opacity:.5;cursor:not-allowed}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.in{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;min-width:140px;max-width:100%}
.in:focus,.btn:focus-visible{outline:2px solid #f59e0b;outline-offset:1px}
textarea.in{width:100%;resize:vertical}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#faf9f7}
td{padding:9px 10px;border-bottom:1px solid #f0ece5;vertical-align:middle}
tr:hover td{background:#fffaf2}
td .btn+.btn{margin-left:4px}
.b{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b.ok{background:var(--okl);color:var(--ok)}.b.warn{background:var(--warnl);color:var(--warn)}.b.bad{background:var(--badl);color:var(--bad)}
.b.info{background:var(--infol);color:var(--info)}.b.pur{background:var(--purl);color:var(--pur)}.b.gray{background:var(--grayl);color:var(--gray)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px;flex:none;object-fit:cover;vertical-align:middle}
.who{display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--muted);font-weight:600}
.tab.on{color:var(--pri);border-color:var(--pri)}.tab .cnt{background:var(--grayl);border-radius:99px;font-size:11px;padding:0 7px;margin-left:4px}
.bars .row{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.bar{height:10px;background:var(--grayl);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--grayl);margin:8px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin:6px 0}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.c-Available{background:#86efac}.c-Occupied{background:#f87171}.c-Reserved{background:#fcd34d}.c-Cleaning{background:#93c5fd}
.alert{border-left:4px solid var(--pri);background:var(--pri-l);padding:9px 12px;border-radius:8px;margin-bottom:8px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.alert.bad{border-color:var(--bad);background:var(--badl)}.alert.info{border-color:var(--info);background:var(--infol)}
.room{border:1px solid var(--line);border-radius:var(--r);padding:10px;background:#fffdf9}
.rh{display:flex;justify-content:space-between;margin-bottom:8px;gap:6px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.beds{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.bed{border:1px solid #0001;border-radius:8px;padding:6px 8px;text-align:left;display:flex;flex-direction:column;min-height:46px}
.bed small{color:#0009;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bed:hover{filter:brightness(.95);outline:2px solid #0003}
.s-Available{background:#dcfce7}.s-Occupied{background:#fecaca}.s-Reserved{background:#fef3c7}.s-Cleaning{background:#dbeafe}
.fl{font-weight:700;margin:12px 0 6px;color:var(--pri-d)}
#overlay{position:fixed;inset:0;background:#1f130c99;display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:100}
#overlay.open{display:flex}
.mdl{background:#fff;border-radius:12px;width:min(640px,100%);box-shadow:0 20px 60px #0005}
.mdl.wide{width:min(980px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.x{background:none;border:0;font-size:24px;line-height:1;color:var(--muted)}
.mb{padding:16px 18px}.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;background:#faf9f7;border-radius:0 0 12px 12px}
form.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}.fld.full{grid-column:1/-1}.fld>span{font-weight:600;font-size:12.5px}.fld .in{width:100%}
.rq{color:var(--bad);font-style:normal}
.err{grid-column:1/-1;background:var(--badl);color:var(--bad);padding:8px 12px;border-radius:8px;font-weight:600}
.note{background:var(--pri-l);border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;margin-bottom:12px}.kv div span{display:block;font-size:12px;color:var(--muted)}
.tl{border-left:2px solid var(--line);margin:6px 0 0 6px;padding-left:14px}.tl div{margin:0 0 8px;position:relative;font-size:13px}.tl div::before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--pri)}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:#1f2328;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px #0004;max-width:360px}.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#fef3e2,#f6f4f0)}
.lg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;max-width:760px;width:100%;box-shadow:0 12px 40px #0001}
.ucards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px}
.ucard{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.ucard:hover{border-color:var(--pri);background:var(--pri-l)}
.ucard b{display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--grayl);border-radius:6px;padding:2px 8px;font-size:12px}
/* structure tree + small helpers */
.tree .trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 8px;border-radius:8px}
.tree .trow:hover{background:#fffaf2}
.tree .kids{margin-left:12px;border-left:2px solid var(--line);padding-left:10px}
.tgl{background:none;border:0;width:24px;height:24px;border-radius:6px;color:var(--muted);flex:none}
.tgl:hover{background:var(--grayl)}
.tacts{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.bchips{display:flex;gap:6px;flex-wrap:wrap;padding:0 8px 10px 8px}
.bchip{display:inline-flex;align-items:center;gap:5px;border:1px solid #0001;border-radius:8px;padding:2px 3px 2px 8px;font-size:12.5px}
.bchip small{color:#0009;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bchip button{border:0;background:#0000000f;border-radius:5px;width:20px;height:20px;line-height:1;font-size:12px;padding:0;color:#333}
.bchip button:hover{background:#0002}
.chip button{border:0;background:none;color:var(--muted);padding:0 2px;font-size:13px;line-height:1}
.chip button:hover{color:var(--bad)}
.btn.dng{color:var(--bad);border-color:#efc4c4;background:#fff}.btn.dng:hover{background:var(--badl)}
@media(max-width:900px){
 #side{position:fixed;left:-260px;z-index:90;transition:left .2s;top:27px;height:calc(100vh - 27px)}#side.open{left:0}
 .burger{display:block}.prof .t{display:none}main{padding:14px}form.f2{grid-template-columns:1fr}.bars .row{grid-template-columns:110px 1fr 30px}
}
@media print{#side,.top,.ribbon,.acts,.filters,.tabs{display:none!important}.card{border:0}}
</style>
</head>
<body>

<div id="login" hidden></div>

<div id="app" hidden>
  <div class="ribbon">PROTOTYPE — sample data stored only in this browser (localStorage). Roles are simulated and NOT secure. Do not enter real sewadar records.</div>
  <div class="shell">
    <aside id="side">
      <div class="brand"><b>DJJS Noormahal</b><span>Sewadar &amp; Accommodation</span></div>
      <nav id="nav"></nav>
    </aside>
    <div class="content">
      <header class="top">
        <button class="burger" data-act="toggleSide" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <div class="gsw">
          <svg class="ic" viewBox="0 0 24 24"><path d="M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4.3-4.3"/></svg>

          <div class="dd" id="profDD" hidden style="min-width:280px"></div>
        </div>
      </header>
      <main id="main"></main>
    </div>
  </div>
</div>
<div id="overlay"></div>
<div id="toasts"></div>

<script>
/* =====================================================================
   DJJS Noormahal — Sewadar & Accommodation Management (FRONTEND PROTOTYPE)

   IMPORTANT: Everything here runs in the browser only. Data lives in
   localStorage; "login" and "roles" are demo switches. None of it is
   secure. For production, replace the Store layer with calls to a backend
   API (PostgreSQL) that enforces authentication and permissions.

   Suggested future tables: branches, members, registrations (visits),
   allocations (bed history), duties (sewa history), attendance,
   sites/buildings/rooms/beds, departments, users/roles, audit_log.
   ===================================================================== */
(function(){
'use strict';

/* ---------- 1. Utilities ---------- */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=(n,l=2)=>String(n).padStart(l,'0');
const fmtD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmtD(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return fmtD(d)};
const diffDays=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd=s=>{if(!s)return '—';const p=s.slice(0,10).split('-');return p[2]+' '+MON[+p[1]-1]+' '+p[0]};
const fdt=s=>!s?'—':fd(s)+(s.length>10?', '+s.slice(11,16):'');
const nowLocal=()=>{const d=new Date();return fmtD(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const overlaps=(a1,a2,b1,b2)=>a1<=b2&&b1<=a2;
const ageOf=dob=>{if(!dob)return '';const b=new Date(dob),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const ucase=s=>s.charAt(0).toUpperCase()+s.slice(1);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- 2. Constants & roles ---------- */
const TYPES=['Short-Term','Monthly','Long-Term'];
const STATES_DEF=['Punjab','Delhi','Haryana','Chandigarh','Himachal Pradesh','Jammu & Kashmir','Uttarakhand','Uttar Pradesh','Rajasthan','Maharashtra','Bihar','Madhya Pradesh','Gujarat','West Bengal','Karnataka','Tamil Nadu','Other'];
const RELS_DEF=['Spouse','Parent','Child','Sibling','Relative','Friend','Other'];
const SHIFTS_DEF=[{name:'Morning',time:'05:00–13:00'},{name:'Day',time:'09:00–17:00'},{name:'Evening',time:'13:00–21:00'},{name:'Night',time:'21:00–05:00'}];
/* Editable lists (Admin → Lists & options). These are re-assigned from DB.lists by applyLookups(). */
let STATES=STATES_DEF.slice(),RELS=RELS_DEF.slice(),SHIFTS=SHIFTS_DEF.map(x=>x.name),SHIFT_LBL={};
const shiftLbl=x=>SHIFT_LBL[x]||x;
const ATT=['Present','Absent','Leave','Not Marked'];
const PURPOSES=['Seva during programme','Seva — langar','Seva — maintenance work','Spiritual stay & seva','Seva — security duty','Seva — cleaning drive'];
const BADGE={Draft:'gray',Submitted:'info',Approved:'ok',Rejected:'bad','Checked In':'pur','Checked Out':'gray',Available:'ok',Occupied:'bad',Reserved:'warn',Cleaning:'info',
 Present:'ok',Absent:'bad',Leave:'warn','Not Marked':'gray',Active:'ok',Ended:'gray',Pending:'warn','Short-Term':'info',Monthly:'pur','Long-Term':'warn',Resident:'pur',Overdue:'bad',Expected:'info',Arrived:'ok',Departed:'gray'};
const badge=s=>`<span class="b ${BADGE[s]||'gray'}">${esc(s)}</span>`;

/* Role → page access. e = view+edit, v = view only. NOT security — demo only. */
const ROLES={
 superadmin:{label:'Super Admin / IT Admin',pages:{dashboard:'e',members:'e',branches:'e',prereg:'e',approvals:'e',reception:'e',accommodation:'e',departments:'e',longterm:'e',reports:'e',admin:'e'}},
 manager:{label:'Noormahal Sewadar Manager',pages:{dashboard:'e',members:'e',branches:'e',prereg:'e',approvals:'e',reception:'v',accommodation:'v',departments:'e',longterm:'e',reports:'v'}},
 coordinator:{label:'Branch Coordinator',pages:{dashboard:'v',members:'e',branches:'v',prereg:'e',longterm:'v',reports:'v'}},
 reception:{label:'Reception Staff',pages:{dashboard:'v',members:'e',prereg:'v',reception:'e',accommodation:'v',departments:'v',reports:'v'}},
 accom:{label:'Accommodation Manager',pages:{dashboard:'v',members:'v',reception:'v',accommodation:'e',longterm:'v',reports:'v'}},
 supervisor:{label:'Department Supervisor',pages:{dashboard:'v',departments:'e',reports:'v'}},
 viewer:{label:'Management / Report Viewer',pages:{dashboard:'v',branches:'v',accommodation:'v',longterm:'v',reports:'v'}}
};
const ROLE_DEFAULTS=JSON.parse(JSON.stringify(ROLES));
const USERS_DEF=[
 {id:'u1',name:'IT Admin (Demo)',role:'superadmin'},
 {id:'u2',name:'Sewadar Manager (Demo)',role:'manager'},
 {id:'u3',name:'Coordinator – Ludhiana (Demo)',role:'coordinator',branchName:'Ludhiana'},
 {id:'u4',name:'Coordinator – Amritsar (Demo)',role:'coordinator',branchName:'Amritsar'},
 {id:'u5',name:'Reception Staff (Demo)',role:'reception'},
 {id:'u6',name:'Accommodation Manager (Demo)',role:'accom'},
 {id:'u7',name:'Supervisor – Security (Demo)',role:'supervisor',deptName:'Security'},
 {id:'u8',name:'Management Viewer (Demo)',role:'viewer'}
];
const NAV=[['dashboard','Dashboard','M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z'],
 ['members','Member Master','M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75'],
 ['branches','Branches','M3 21h18M5 21V7l7-4 7 4v14M9 9h2M13 9h2M9 13h2M13 13h2'],
 ['prereg','Pre-Registration','M9 2h6v4H9zM7 4H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2h-2M8 12h8M8 16h5'],
 ['approvals','Approvals','M22 11.08V12a10 10 0 11-5.93-9.14M22 4L12 14.01l-3-3'],

/** Allocate a bed to an approved/checked-in stay. Returns an error string or null. */
function allocate(regId,bedId,from,to,reason){
 const r=reg(regId),b=bedO(bedId);
 if(!r||!['Approved','Checked In'].includes(r.status))return 'Only approved members can be allocated accommodation.';
 if(activeAlloc(regId))return 'This stay already has a bed. Use Transfer instead.';
 if(!b)return 'Select a bed.';
 if(!from||!to||to<from)return 'Check the allocation dates.';
 const early=Math.min(stayStart(r)>dayOf(r.actualIn||'9999')?dayOf(r.actualIn||'9999'):stayStart(r));
 if(to>stayEnd(r))return `Allocation cannot run past the approved stay end (${fd(stayEnd(r))}). Extend the stay first.`;
 if(from<(r.actualIn&&dayOf(r.actualIn)<stayStart(r)?dayOf(r.actualIn):stayStart(r)))return `Allocation cannot start before the stay start (${fd(stayStart(r))}).`;
 if(b.cleaning)return 'This bed is marked for cleaning. Mark it cleaned first.';
 const c=conflicts(bedId,from,to);
 if(c.length){const o=c[0];return `Bed already allocated to ${mName(o.memberId)} (${fd(o.from)} – ${fd(o.to)}).`}
 DB.allocs.push({id:nid('al','AL',5),regId,memberId:r.memberId,bedId,from,to,active:true,reason:reason||'Allocation',createdOn:nowLocal(),by:who()});
 hist(r,`Bed allocated: ${bedShort(b)} (${fd(from)} – ${fd(to)})`);log(`Bed ${bedShort(b)} allocated to ${mName(r.memberId)}`);
 return null;
}
/** Move a resident to another bed from `date`; the old allocation is kept as history. */
function transferBed(regId,newBedId,date){
 const r=reg(regId),old=activeAlloc(regId),nb=bedO(newBedId);
 if(!old)return 'No current bed to transfer from.';
 if(!nb)return 'Select the new bed.';
 if(nb.id===old.bedId)return 'Choose a different bed.';
 if(!date||date<old.from||date>old.to)return `Transfer date must be within ${fd(old.from)} – ${fd(old.to)}.`;
 if(nb.cleaning)return 'The new bed is marked for cleaning.';
 const c=conflicts(newBedId,date,old.to);
 if(c.length)return `New bed is already allocated to ${mName(c[0].memberId)} (${fd(c[0].from)} – ${fd(c[0].to)}).`;
 const oldBed=bedO(old.bedId),origTo=old.to;
 old.active=false;old.endedOn=date;old.endReason='Transferred';old.to=date;
 if(r.status==='Checked In'&&old.from<=today())oldBed.cleaning=true;
 DB.allocs.push({id:nid('al','AL',5),regId,memberId:r.memberId,bedId:newBedId,from:date,to:origTo,active:true,reason:'Transfer',createdOn:nowLocal(),by:who()});
 hist(r,`Bed transfer: ${bedShort(oldBed)} → ${bedShort(nb)} from ${fd(date)}`);log(`Transfer ${mName(r.memberId)} to ${bedShort(nb)}`);
 return null;
}
/** Extend a stay; also stretches the active bed allocation if the bed stays free. */

 if(!newTo||newTo<=end)return `New end date must be after the current end (${fd(end)}).`;
 if(al){const c=conflicts(al.bedId,al.from,newTo,al.id);
  if(c.length)return `The bed is reserved by ${mName(c[0].memberId)} from ${fd(c[0].from)}. Transfer this member to another bed first or choose an earlier date.`}
 r.approvedTo=newTo;r.departure=newTo;
 if(al)al.to=newTo;

 hist(r,`Stay extended to ${fd(newTo)}${note?' — '+note:''}`);log(`Stay extended: ${mName(r.memberId)} → ${fd(newTo)}`);
 return null;
}
function doCheckIn(regId,dt){

function doCheckOut(regId,dt){

/** Undo a wrongly recorded departure: member is back in residence; bed and sewa are restored where still possible. */
function undoCheckOut(regId){
 const r=reg(regId);if(!r||r.status!=='Checked Out')return 'This visit is not checked out.';
 const u=r.undo||{},notes=[];
 const al=u.allocId?byId(DB.allocs,u.allocId):DB.allocs.filter(a=>a.regId===regId&&a.endReason==='Checked out').pop();
 if(al&&!al.active&&al.endReason==='Checked out'){
  if(bedO(al.bedId)&&!conflicts(al.bedId,al.from,al.to,al.id).length){al.active=true;delete al.endedOn;delete al.endReason;if(!u.bedWasCleaning)bedO(al.bedId).cleaning=false;notes.push('bed restored')}
  else notes.push('bed could not be restored — assign a bed again');
 }

 if(du&&du.status==='Ended'){du.status='Active';delete du.endedOn;if(u.dutyTo)du.to=u.dutyTo;notes.push('sewa restored')}

  if(![10,12].includes(i)){

 for(let i=0;i<5;i++){const a=-ri(120,200);past(M[i],a,a+ri(2,10))}

 for(let i=53;i<56;i++){const r=mkReg(M[i],{status:'Draft',arrival:d(ri(10,20)),departure:d(ri(21,26)),createdOn:d(-1)});H(r,[[d(-1)+'T09:00','Branch Coordinator','Draft created']])}
 for(let i=56;i<58;i++){const r=mkReg(M[i],{status:'Rejected',arrival:d(2),departure:d(6),remarks:i===56?'Dates clash with a major event; kindly re-apply after the 20th.':'Please attach coordinator confirmation and re-submit.',createdOn:d(-4)});

function toast(msg,kind){const el=document.createElement('div');el.className='toast '+(kind||'');el.textContent=msg;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),3800)}
/* ---- Camera capture (getUserMedia). Falls back to the device camera app / file picker if the camera is blocked or unavailable. ---- */
let camStream=null;
function stopCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}const b=$('#camBox');if(b)b.hidden=true}
/** Downscale an image data-URL to max 240px JPEG so localStorage stays small */
function shrink(src,cb){const im=new Image();im.onload=()=>{const s=Math.min(1,240/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.75))};im.src=src}
function startCam(fallback,done){
 stopCam();
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Camera not available here — choose a photo instead.');fallback();return}
 navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:640}},audio:false}).then(st=>{
  camStream=st;const v=$('#camV');v.srcObject=st;$('#camBox').hidden=false;
  $('#camSnap').onclick=()=>{
   if(!v.videoWidth){toast('Camera is still starting — try again');return}
   const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
   const url=c.toDataURL('image/jpeg',.9);stopCam();shrink(url,done)};
  $('#camX').onclick=stopCam;
 }).catch(()=>{toast('Camera blocked or not found — pick a photo instead.');fallback()});
}
function modal(o){
 stopCam();
 $('#overlay').innerHTML=`<div class="mdl${o.wide?' wide':''}" role="dialog" aria-modal="true"><div class="mh"><h2>${o.title}</h2><button class="x" data-act="closeModal" aria-label="Close">×</button></div><div class="mb">${o.body}</div>${o.footer?`<div class="mf">${o.footer}</div>`:''}</div>`;
 $('#overlay').classList.add('open');if(o.onOpen)o.onOpen();
}
const closeModal=()=>{stopCam();const r=$('#overlay');r.classList.remove('open');r.innerHTML=''};
function confirmBox(title,text,okLabel,cb,danger){
 modal({title,body:`<p>${text}</p>`,footer:`<button class="btn" data-act="closeModal">Cancel</button><button class="btn ${danger?'bad':'pri'}" id="cfOk">${okLabel}</button>`,onOpen(){$('#cfOk').onclick=()=>{closeModal();cb()}}});
}
const optHtml=(opts,val,ph)=>(ph!=null?`<option value="">${esc(ph)}</option>`:'')+opts.map(o=>{const v=typeof o==='object'?o.v:o,l=typeof o==='object'?o.l:o;return `<option value="${esc(v)}"${String(v)===String(val)?' selected':''}>${esc(l)}</option>`}).join('');
function fieldHtml(f,vals){
 const v=vals[f.n]!=null?vals[f.n]:(f.def!=null?f.def:'');
 let inp;
 if(f.t==='select')inp=`<select class="in" id="f-${f.n}"${f.dis?' disabled':''}>${optHtml(f.opts,v,f.ph)}</select>`;
 else if(f.t==='textarea')inp=`<textarea class="in" id="f-${f.n}" rows="2" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
 else if(f.t==='file')return `<div class="fld full"><span style="font-weight:600;font-size:12.5px">${esc(f.l)}</span>
  <div class="who"><span id="phPrev"></span><div class="acts"><button type="button" class="btn sm pri" id="phCam">📷 Take photo</button><button type="button" class="btn sm" id="phUp">Upload</button><button type="button" class="btn sm" id="phRm" hidden>Remove</button></div></div>
  <input type="file" id="f-${f.n}" accept="image/*" hidden><input type="file" id="f-${f.n}Cam" accept="image/*" capture="user" hidden>
  <div id="camBox" hidden style="margin-top:8px"><video id="camV" autoplay playsinline muted style="width:100%;max-width:340px;border-radius:10px;background:#000;display:block"></video>
  <div class="acts" style="margin-top:8px"><button type="button" class="btn sm ok" id="camSnap">Capture</button><button type="button" class="btn sm" id="camX">Cancel</button></div></div>
  <small>Take a live photo with the camera (allow camera access when asked) or upload one.</small></div>`;
 else inp=`<input class="in" id="f-${f.n}" type="${f.t||'text'}" value="${esc(v)}" placeholder="${esc(f.ph||'')}"${f.list?` list="${f.list}"`:''}${f.ro?' readonly':''}>`;
 return `<label class="fld${f.full?' full':''}"><span>${esc(f.l)}${f.req?' <i class="rq">*</i>':''}</span>${inp}${f.hint?`<small>${f.hint}</small>`:''}</label>`;
}
function collect(fields){
 const vals={};
 for(const f of fields){
  if(f.t==='file')continue;
  const el=$('#f-'+f.n);const v=el?el.value.trim():'';vals[f.n]=v;
  if(f.req&&!v)return {error:`${f.l} is required.`,el};
  if(v&&f.t==='tel'&&!/^[6-9]\d{9}$/.test(v))return {error:`${f.l} must be a valid 10-digit mobile number.`,el};
 }
 return {values:vals};
}
/** Generic form modal. buttons: [{label,cls,run(values)->errorString|null}] */
function formModal(o){
 const vals=o.values||{};
 modal({title:o.title,wide:o.wide,body:(o.pre||'')+`<form id="mf" class="f2" novalidate>${o.fields.map(f=>fieldHtml(f,vals)).join('')}<div class="err" id="mfErr" hidden></div></form>`,
  footer:`<button class="btn" data-act="closeModal">Cancel</button>`+o.buttons.map((b,i)=>`<button class="btn ${b.cls||'pri'}" data-btn="${i}">${b.label}</button>`).join(''),
  onOpen(){
   $('#mf').addEventListener('submit',e=>e.preventDefault());
   $$('[data-btn]').forEach(bt=>bt.onclick=()=>{
    const c=collect(o.fields);const show=m=>{const e=$('#mfErr');e.textContent=m;e.hidden=false;e.scrollIntoView({block:'nearest'})};
    if(c.error){show(c.error);if(c.el)c.el.focus();return}
    const err=o.buttons[+bt.dataset.btn].run(c.values);
    if(err)show(err);
   });
   if(o.onOpen)o.onOpen();
  }});
}

function notices(){
 const t=today(),R=regs(),n=[];
 const subs=R.filter(r=>r.status==='Submitted').length,ex=R.filter(r=>pendingExt(r)).length;
 if(can('approvals')&&subs)n.push(['approvals',`${subs} registration(s) awaiting approval`]);
 if(can('approvals')&&ex)n.push(['approvals',`${ex} extension request(s)`]);
 const arr=R.filter(r=>r.status==='Approved'&&stayStart(r)<=t).length;if(can('reception')&&arr)n.push(['reception',`${arr} sewadar expected at reception`]);
 const od=R.filter(r=>r.status==='Checked In'&&stayEnd(r)<t).length;if(can('longterm')&&od)n.push(['longterm',`${od} overdue stay(s)`]);
 const soon=R.filter(r=>r.status==='Checked In'&&['Monthly','Long-Term'].includes(stayType(r))&&diffDays(t,stayEnd(r))>=0&&diffDays(t,stayEnd(r))<=7).length;if(can('longterm')&&soon)n.push(['longterm',`${soon} long-stay approval(s) expiring within 7 days`]);
 const nb=R.filter(r=>['Approved','Checked In'].includes(r.status)&&!activeAlloc(r.id)).length;if(can('accommodation')&&nb)n.push(['accommodation',`${nb} member(s) need a bed`]);
 const cl=DB.beds.filter(b=>b.cleaning).length;if(can('accommodation')&&cl)n.push(['accommodation',`${cl} bed(s) pending cleaning`]);
 return n;
}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');
 if(el){const f=ACT[el.dataset.act];if(f){f(el.dataset,el,e)}return}
 if(e.target.id==='overlay')closeModal();
 if(!e.target.closest('.dd,.iconbtn,.prof,.gsw'))closeMenus();
});
/* filter inputs: redraw only the table where possible so typing keeps focus */
function onFilter(e){
 const el=e.target;
 if(el.dataset&&el.dataset.att){setAtt(UI.f['at.date']||today(),el.dataset.att,el.value);Store.save();toast('Attendance saved','ok');return}
 if(!el.dataset||!el.dataset.f)return;
 UI.f[el.dataset.f]=el.value;
 if(el.dataset.f==='acc.site')UI.f['acc.bld']='';
 const p=PAGES[UI.page];
 if(el.dataset.full||!p.table||!$('#tbl')){const pos=el.selectionStart,id=el.dataset.f;render();const n=$(`[data-f="${id}"]`);if(n&&n.tagName==='INPUT'&&n.type!=='date'){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}
 else $('#tbl').innerHTML=p.table();
}
document.addEventListener('input',e=>{if(e.target.tagName==='INPUT'&&e.target.dataset.f)onFilter(e)});
document.addEventListener('change',e=>{
 if(e.target.id==='impFile'){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||d.v!==1||!Array.isArray(d.members)||!Array.isArray(d.regs)||!Array.isArray(d.beds)||!Array.isArray(d.branches))throw 0;DB=d;migrate();CUR=Object.assign({},DB.users.find(u=>CUR&&u.id===CUR.id)||DB.users[0]);Store.save();UI.f={};UI.closed={};render();toast('Backup imported','ok')}catch(x){toast('Not a valid backup file','bad')}};rd.readAsText(f);e.target.value='';return}
 if(e.target.dataset&&e.target.dataset.perm){const [r,p]=e.target.dataset.perm.split('|');if(!DB.perms)DB.perms={};if(!DB.perms[r])DB.perms[r]=Object.assign({},ROLES[r].pages);DB.perms[r][p]=e.target.value;applyPerms();Store.save();toast('Access updated','ok');return}
 if(e.target.tagName!=='INPUT'||e.target.type==='date')onFilter(e);
});
